[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sagittarius-engine"
version = "2.3.0"
description = "A lightweight, modular Python Application Engine"
readme = "readme.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "AnhEmbedded Team", email = "Anh.Embedded@gmail.com"}
]
keywords = ["clean-architecture", "framework", "event-driven", "cqrs", "dependency-injection"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

[project.urls]
Homepage = "https://github.com/anhembedded/Sagittarius-Engine"
Repository = "https://github.com/anhembedded/Sagittarius-Engine.git"
Documentation = "https://github.com/anhembedded/Sagittarius-Engine/tree/main/.agents"

[project.scripts]
# `sagittarius-audit = "tools.audit_dashboard:main"` was removed here, not
# fixed. The command could not start for any consumer, in three independent
# ways: the target module imports PySide6 at module scope while this wheel
# declares no dependencies; its inner imports are bare (`from application...`)
# and resolve only when the process starts in one specific directory; and this
# entry point names a module where a function is required. It shipped in
# v2.1.0 and v2.2.0 advertising a command that has never run.
#
# Repairing it would be work on a component `EPIC-005` §3 schedules for
# deletion, so the honest minimum is to stop promising it. `EPIC-005`
# Milestone D re-adds a console script pointing at something that works.
#
# `scripts/verify_wheel_importable.py` step 3 now resolves every entry point
# declared here, so the next one cannot ship broken the way this one did.
sagittarius-doctor = "sagittarius_engine.extensions.diagnostics.cli:main"
# `EPIC-005D`: the thin attach CLI for the trace recorder's live transport
# (`extensions/audit/infra/trace_server.py`). Needs `websockets` at runtime —
# declared as a real dependency, not an extra, in requirements.txt: EPIC-005A
# names the transport as a bare requirement, unlike OTel support below, which
# is explicitly optional.
sagittarius-trace = "sagittarius_engine.extensions.audit.cli:main"

[tool.setuptools.packages.find]
include = ["sagittarius_engine*", "tools*"]

[tool.setuptools.package-data]
sagittarius_engine = [
    # PEP 561 marker. Without it a type checker ignores this package's inline
    # annotations entirely and every consumer sees the engine as untyped —
    # which also cascades, silently shrinking how much of *their* code gets
    # checked. This block is the only mechanism shipping non-.py files, so the
    # marker must be listed here to reach the wheel (TASK-027).
    "py.typed",
    "extensions/pyside_mvc/Sagittarius/UI/qmldir",
    "extensions/pyside_mvc/Sagittarius/UI/*/*.qml",
    "extensions/pyside_mvc/runtime/*.qml",
]

[project.optional-dependencies]
# `audit = ["rich>=13.0.0"]` was removed by EPIC-005A's teardown. Its only
# consumer was `tools/audit_dashboard_cli.py`, deleted in the same change —
# and that command could never connect in the first place (EPIC-005 §2, D1:
# it polled HTTP against a socket that only ever spoke WebSocket). Nothing in
# the engine imports `rich`, so the extra installed a dependency for code
# that no longer exists.
# EPIC-005C requirement 4: the core records into its own stdlib ring buffer
# and knows nothing about OTel. This extra exists only for
# `extensions/audit/exporters/otel.py`, which guards its own import at use
# time — uninstalling this extra leaves the recorder, the .sagtrace format,
# and the Perfetto exporter (all stdlib-only) working.
otel = [
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
]

[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'
exclude = '''
/(
  \.git
 | \.hg
 | \.mypy_cache
 | \.venv
 | _build
 | buck-out
 | build
 | dist
 | docs/kb
  )/
'''

[tool.isort]
profile = "black"
line_length = 88
include_trailing_comma = true
force_grid_wrap = 0
combine_as_imports = true
balanced_wrapping = true
src_paths = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [".venv", "build", "dist", "__pycache__", ".pytest_cache", ".git"]

[tool.ruff.lint]
# Single source of truth. A root `ruff.toml` used to shadow this whole block —
# ruff picks one config file, it does not merge — so none of this ran until
# 2026-08-23 (TASK-021). `C901` and `UP037` came from that file's ignore list
# and are folded in here; dropping them would be a behaviour change.
#
# `select`, deliberately, not `extend-select`. `extend-select` ADDS to ruff's
# built-in defaults, and those defaults widen with every ruff release — which
# is why a newer local ruff reported 354 findings against CI's ~0. A closed
# `select` set makes the rule set a property of this file rather than of
# whichever ruff version happens to be installed. Widen it on purpose, in a
# commit, not by upgrading a tool.
select = ["E", "F", "W", "C", "I", "UP", "RET"]
ignore = ["E501", "C901", "UP037"]
per-file-ignores = {"__init__.py" = ["F401"]}

[tool.mypy]
python_version = 3.12
ignore_missing_imports = true
follow_imports = "skip"
show_error_codes = true
pretty = true
disable_error_code = ["annotation-unchecked"]
files = ["sagittarius_engine", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = "."
# The two `websockets.legacy` / `WebSocketClientProtocol` DeprecationWarning
# filters here were removed by EPIC-005A's teardown: they existed for the old
# `WebsocketBroadcaster`, which used that legacy API. `TraceServer` uses
# `websockets.asyncio.server` and the CLI uses `websockets.sync.client`, so
# nothing emits them any more — and a filter for a warning that can no longer
# fire would silently start hiding a real one if the legacy API ever came back.
