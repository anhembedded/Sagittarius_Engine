[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sagittarius-engine"
version = "2.1.0"
description = "A lightweight, modular Python Application Engine"
readme = "readme.md"
requires-python = ">=3.14"
license = {text = "MIT"}
authors = [
    {name = "AnhEmbedded Team", email = "Anh.Embedded@gmail.com"}
]
keywords = ["clean-architecture", "framework", "event-driven", "cqrs", "dependency-injection"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

[project.urls]
Homepage = "https://github.com/anhembedded/Sagittarius-Engine"
Repository = "https://github.com/anhembedded/Sagittarius-Engine.git"
Documentation = "https://github.com/anhembedded/Sagittarius-Engine/tree/main/.agents"

[project.scripts]
sagittarius-audit = "tools.audit_dashboard:main"

[tool.setuptools.packages.find]
include = ["sagittarius_engine*", "tools*"]

[tool.setuptools.package-data]
sagittarius_engine = [
    "extensions/pyside_mvc/Sagittarius/UI/qmldir",
    "extensions/pyside_mvc/Sagittarius/UI/*/*.qml",
    "extensions/pyside_mvc/runtime/*.qml",
]

[project.optional-dependencies]
audit = ["rich>=13.0.0"]

[tool.black]
line-length = 88
target-version = ["py314"]
include = '\.pyi?$'
exclude = '''
/(
  \.git
 | \.hg
 | \.mypy_cache
 | \.venv
 | _build
 | buck-out
 | build
 | dist
 | docs/kb
  )/
'''

[tool.isort]
profile = "black"
line_length = 88
include_trailing_comma = true
force_grid_wrap = 0
combine_as_imports = true
balanced_wrapping = true
src_paths = ["src"]

[tool.ruff]
line-length = 88
target-version = "py314"
exclude = [".venv", "build", "dist", "__pycache__", ".pytest_cache", ".git"]

[tool.ruff.lint]
# Single source of truth. A root `ruff.toml` used to shadow this whole block —
# ruff picks one config file, it does not merge — so none of this ran until
# 2026-08-23 (TASK-021). `C901` and `UP037` came from that file's ignore list
# and are folded in here; dropping them would be a behaviour change.
#
# `select`, deliberately, not `extend-select`. `extend-select` ADDS to ruff's
# built-in defaults, and those defaults widen with every ruff release — which
# is why a newer local ruff reported 354 findings against CI's ~0. A closed
# `select` set makes the rule set a property of this file rather than of
# whichever ruff version happens to be installed. Widen it on purpose, in a
# commit, not by upgrading a tool.
select = ["E", "F", "W", "C", "I", "UP", "RET"]
ignore = ["E501", "C901", "UP037"]
per-file-ignores = {"__init__.py" = ["F401"]}

[tool.mypy]
python_version = 3.14
ignore_missing_imports = true
follow_imports = "skip"
show_error_codes = true
pretty = true
disable_error_code = ["annotation-unchecked"]
files = ["sagittarius_engine", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = "."
filterwarnings = [
    "ignore:.*websockets.legacy is deprecated.*:DeprecationWarning",
    "ignore:.*websockets.WebSocketClientProtocol is deprecated.*:DeprecationWarning"
]
