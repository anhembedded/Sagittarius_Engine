name: Sagittarius Engine CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  ACTIONS_NODE20_DEPRECATION_WARNING: 'false'

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1: Lint & Static Analysis (runs first, fails fast)
  # ──────────────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff — lint
        run: ruff check sagittarius_engine tests examples tools

      - name: Ruff — format check
        run: ruff format --check sagittarius_engine tests examples tools

      - name: mypy — type check
        run: mypy sagittarius_engine tests examples tools --ignore-missing-imports --follow-imports=skip

  # ──────────────────────────────────────────────────────────────
  # Job 2: Test Matrix (Python 3.14 dev on Linux & Windows)
  # ──────────────────────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.14-dev"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --ignore=tests/benchmark_runtime.py \
            --cov=sagittarius_engine \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            -q

      - name: Upload coverage (Python 3.14-dev)
        if: matrix.python-version == '3.14-dev'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # ──────────────────────────────────────────────────────────────
  # Job 3: Architecture Guard Tests
  # ──────────────────────────────────────────────────────────────
  architecture:
    name: Architecture Guard
    needs: [lint, test]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run architecture tests
        run: pytest tests/test_architecture.py -v

  # ──────────────────────────────────────────────────────────────
  # Job 4: Reference Application Integration Tests
  # ──────────────────────────────────────────────────────────────
  examples:
    name: Reference Applications
    needs: [test, architecture]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run example integration tests
        run: PYTHONPATH=. pytest tests/test_examples.py -v

  # ──────────────────────────────────────────────────────────────
  # Job 5: Benchmark (informational, never blocks)
  # ──────────────────────────────────────────────────────────────
  benchmark:
    name: Performance Benchmark
    needs: test
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run benchmarks
        run: PYTHONPATH=. python tests/benchmark_runtime.py

  # ──────────────────────────────────────────────────────────────
  # Job 6: Security Audit (Bandit & Pip-Audit)
  # ──────────────────────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Bandit — SAST security scan
        run: bandit -r sagittarius_engine

      - name: Pip-Audit — dependency vulnerability scan
        run: pip-audit

  # ──────────────────────────────────────────────────────────────
  # Job 7: Package Build & Distribution Validation
  # ──────────────────────────────────────────────────────────────
  package:
    name: Build & Distribute Check
    needs: [lint, test]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build wheel and sdist
        run: python -m build

      - name: Validate distribution metadata with Twine
        run: twine check dist/*
