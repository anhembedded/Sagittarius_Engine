name: Sagittarius Engine CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  ACTIONS_NODE20_DEPRECATION_WARNING: 'false'
  # Every runner here is headless. Qt refuses to start without a platform
  # plugin, and `offscreen` is the one that needs no display server; it is a
  # real plugin on Windows too, so one declaration covers the whole matrix.
  QT_QPA_PLATFORM: offscreen

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1: Lint & Static Analysis (runs first, fails fast)
  # ──────────────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # Runtime requirements, not just the dev toolchain. mypy's job is to check
      # the code as it will actually run, and without PySide6 installed every Qt
      # type resolves to `Any` -- which is *weaker* checking, not stricter, and
      # produced a false positive that kept this job red for days:
      # `thread_affinity.py`'s `cls.__new__(cls)` has no matching overload when
      # `cls` is `type[Any]`, while the same command with PySide6 present reports
      # `Success: no issues found in 436 source files`.
      #
      # The `test` job has always installed both files. The gap between the two
      # was the whole defect: a linter checking a different program than the one
      # the tests run.
      - name: Install dependencies and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Ruff — lint
        run: ruff check sagittarius_engine tests examples tools

      - name: Ruff — format check
        run: ruff format --check sagittarius_engine tests examples tools

      - name: mypy — type check
        run: mypy sagittarius_engine tests examples tools --ignore-missing-imports --follow-imports=skip

  # ──────────────────────────────────────────────────────────────
  # Job 2: Test Matrix (Python 3.12 on Linux & Windows)
  # ──────────────────────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      # Full history, not the default shallow (`fetch-depth: 1`) clone.
      # `tests/test_agents_docs_resolve.py::test_staleness_check_actually_catches_the_original_bug`
      # runs the staleness checker against the exact pre-fix text of
      # `.agents/context/repository.md` by reading it out of commit `0bd461b`
      # (2026-08-02) -- that is the whole point of the test: proving the
      # mechanism catches a bug that really sat undetected, rather than only
      # agreeing with a fixture someone wrote to make it pass. A depth-1
      # checkout does not contain that commit, so the test could only ever
      # fail here: `git show` exits 128 and the assertion is never reached.
      #
      # It went unnoticed because this job has been *skipped*, not run, since
      # `lint` went red -- the same gating trap TASK-040 exists to close. Only
      # this job runs the whole `tests/` tree, so only this checkout needs the
      # history; the others name single files that do not touch git. The cost
      # is small and measured: 794 commits, 2.77 MiB packed.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - uses: ./.github/actions/qt-system-libs

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        # examples/student_management/tests/ added 2026-08-23: neither this
        # step nor the "examples" job below ever ran it -- that job's own
        # tests/test_examples.py is misleadingly named and only runs
        # unrelated stress tests + the benchmark script, never the sample
        # app's own ~48 tests. Unprotected by any CI job since EPIC-002.
        run: |
          pytest tests/ examples/student_management/tests/ \
            --cov=sagittarius_engine \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            -q

      - name: Upload coverage (Python 3.12)
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # ──────────────────────────────────────────────────────────────
  # Job 3: Architecture Guard Tests
  # ──────────────────────────────────────────────────────────────
  architecture:
    name: Architecture Guard
    needs: [lint, test]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - uses: ./.github/actions/qt-system-libs

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run architecture tests
        run: pytest tests/test_architecture.py -v

  # ──────────────────────────────────────────────────────────────
  # Job 4: Reference Application Integration Tests
  # ──────────────────────────────────────────────────────────────
  examples:
    name: Reference Applications
    needs: [test, architecture]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - uses: ./.github/actions/qt-system-libs

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run example integration tests
        run: PYTHONPATH=. pytest tests/test_examples.py -v

      # EPIC-006E. Runs the wiring inspection against the reference application
      # the same way a consumer would run it against theirs -- the installed
      # command, not an import of the library. `--strict` because the sample app
      # is expected to be exemplary: a warning here is a defect in what this
      # repository holds up as how to build on the engine.
      - name: Wiring inspection (sagittarius-doctor)
        run: |
          pip install -e .
          sagittarius-doctor \
            examples.student_management.doctor_target:build \
            --handler-package examples.student_management \
            --strict

  # ──────────────────────────────────────────────────────────────
  # Job 5: Benchmark (informational, never blocks)
  # ──────────────────────────────────────────────────────────────
  benchmark:
    name: Performance Benchmark
    needs: test
    runs-on: ubuntu-latest
    # Kept deliberately (TASK-020 req. 4): shared GitHub Actions runners have
    # variable performance, so a timing-based benchmark failing the build
    # would produce false-positive breaks unrelated to code correctness. This
    # is *not* what let the job silently rot for months, though — nobody was
    # reading its output either way, which the corrected path below and the
    # job's own visible name/label are meant to make less likely.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - uses: ./.github/actions/qt-system-libs

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run benchmarks
        run: PYTHONPATH=. python tests/runtime/benchmark_runtime.py

      # EPIC-005A's overhead budget is an acceptance criterion, not a note in a
      # document -- but it is a *timing* measurement, and the `test` job runs
      # `pytest --cov`, whose per-line trace hook takes a 157 ns trace point to
      # 2407 ns. Under coverage those two tests skip themselves, so without this
      # step they would run nowhere and the criterion would go unchecked.
      #
      # Deliberately NOT `continue-on-error` like the benchmark above it: that
      # one is timing-based and shared runners are variable, so it must not
      # break a build. This is a 12x-headroom budget check that catches a
      # `str()` or a dataclass construction landing on the capture path -- a
      # correctness regression measured in microseconds, not runner noise.
      - name: Trace recorder overhead budget (EPIC-005A)
        run: pytest tests/extensions/audit/test_trace_recorder.py -q

  # ──────────────────────────────────────────────────────────────
  # Job 6: Security Audit (Bandit & Pip-Audit)
  # ──────────────────────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Bandit — SAST security scan
        run: bandit -r sagittarius_engine

      - name: Pip-Audit — dependency vulnerability scan
        run: pip-audit

  # ──────────────────────────────────────────────────────────────
  # Job 7: Package Build & Distribution Validation
  # ──────────────────────────────────────────────────────────────
  package:
    name: Build & Distribute Check
    needs: [lint, test]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build wheel and sdist
        run: python -m build

      - name: Validate distribution metadata with Twine
        run: twine check dist/*

  # ──────────────────────────────────────────────────────────────
  # Job 8: Package Import Guard
  # ──────────────────────────────────────────────────────────────
  import-guard:
    name: Package Import Guard
    runs-on: ubuntu-latest

    # Deliberately NO `needs:`. Every other job here gates on `lint`, and that
    # is precisely how df51202 shipped: five Python 2 `except A, B:` clauses
    # landed on main, mypy went red, and because lint failed the test,
    # architecture, examples and package jobs were all *skipped* -- for days.
    # The one class of defect that makes the published artifact worthless is
    # the one a gated job can never report, so this job answers "can a
    # consumer install and import this?" on its own, every time.
    #
    # ruff cannot stand in for it: ruff 0.16.4 accepts the bare tuple in an
    # except clause and exits 0 on a file CPython refuses to compile. The
    # `Ruff — lint` step passed on the very commit that broke the package.

    steps:
      - uses: actions/checkout@v4

      # Tracks pyproject's requires-python floor. If that floor is lowered,
      # lower this too: the guard is only meaningful on the oldest interpreter
      # the package claims to support, since that is where a consumer breaks.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # Installing the libraries rather than exempting the Qt modules,
      # deliberately: this script's own docstring says an exemption list "should
      # be a deliberate, argued change rather than a quiet append", and exempting
      # Qt would blind the guard to the largest package in the wheel.
      - uses: ./.github/actions/qt-system-libs

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build the wheel, install it clean, compile and import every module
        run: python scripts/verify_wheel_importable.py
